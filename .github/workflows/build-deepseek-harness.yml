name: Build deepseek-harness image

# Push a tag like `deepseek-harness-v0.1.2-rc.1` to build linux/amd64 +
# linux/arm64 and push ghcr.io/mauricewipf/deepseek-harness-umbrel:<version>.
# Or run manually with a version input. Remember to set the GHCR package
# visibility to public after the first push.

on:
  push:
    tags:
      - "deepseek-harness-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream @deepseek-ai/dsh version (DSH_VERSION build-arg)"
        required: true
        default: "0.1.2-rc.1"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mauricewipf/deepseek-harness-umbrel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#deepseek-harness-v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: images/deepseek-harness
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
          build-args: DSH_VERSION=${{ steps.version.outputs.value }}
